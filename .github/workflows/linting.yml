name: Linting
on:
  push:
    branches:
      - '*'
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
  pull_request:
    branches:
      - master
    paths-ignore:
      - .gitignore
      - LICENSE
      - '*.example'
      - '**.example'
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          src: "./src"
